<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0a1f44">
<title>Mi Álbum Panini 2026</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: #0a1f44; color: #fff; padding-bottom: 80px;
  }
  header {
    background: linear-gradient(135deg, #0a1f44, #1a3a7a);
    padding: 16px; position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  h1 { margin: 0; font-size: 18px; }
  .progress-wrap { margin-top: 8px; }
  .progress-bar {
    background: rgba(255,255,255,.15); height: 10px; border-radius: 5px; overflow: hidden;
  }
  .progress-fill {
    background: linear-gradient(90deg, #00d26a, #00b894);
    height: 100%; transition: width .3s;
  }
  .progress-text { font-size: 13px; margin-top: 4px; opacity: .9; }

  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #06173a; display: flex;
    border-top: 1px solid rgba(255,255,255,.1); z-index: 10;
  }
  nav button {
    flex: 1; background: none; border: 0; color: #8aa; padding: 12px 4px;
    font-size: 11px; cursor: pointer;
  }
  nav button.active { color: #00d26a; }
  nav button .ico { font-size: 20px; display: block; margin-bottom: 2px; }

  main { padding: 12px; }
  .section-card {
    background: #142c5e; border-radius: 12px; padding: 14px;
    margin-bottom: 10px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .section-card:active { transform: scale(.98); }
  .section-name { font-weight: 600; }
  .section-count { font-size: 13px; opacity: .8; }
  .mini-bar {
    width: 60px; height: 6px; background: rgba(255,255,255,.15);
    border-radius: 3px; overflow: hidden; margin-top: 4px;
  }
  .mini-fill { height: 100%; background: #00d26a; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 8px;
  }
  .sticker {
    background: #142c5e; border-radius: 10px; padding: 8px 4px;
    text-align: center; cursor: pointer; position: relative;
    border: 2px solid transparent; transition: all .15s;
  }
  .sticker.owned { background: #1a5c3a; border-color: #00d26a; }
  .sticker.foil::before {
    content: "★"; position: absolute; top: 2px; right: 4px;
    color: #ffd700; font-size: 12px;
  }
  .sticker .num { font-weight: 700; font-size: 13px; }
  .sticker .nm { font-size: 10px; opacity: .85; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sticker .dup {
    position: absolute; bottom: 2px; right: 4px;
    background: #ff6b35; color: #fff; border-radius: 10px;
    padding: 1px 5px; font-size: 10px; font-weight: 700;
  }

  .back-btn {
    background: none; border: 0; color: #00d26a;
    font-size: 14px; margin-bottom: 10px; cursor: pointer; padding: 0;
  }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; align-items: flex-end; z-index: 100;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: #142c5e; width: 100%; border-radius: 20px 20px 0 0;
    padding: 20px; animation: slideUp .25s;
  }
  @keyframes slideUp { from { transform: translateY(100%); } }
  .modal h2 { margin: 0 0 4px; font-size: 20px; }
  .modal .sub { opacity: .7; font-size: 13px; margin-bottom: 18px; }
  .btn-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .btn {
    flex: 1; padding: 14px; border-radius: 10px; border: 0;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: #00d26a; color: #06173a; }
  .btn-secondary { background: rgba(255,255,255,.1); color: #fff; }
  .dup-row {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,0,0,.2); padding: 12px; border-radius: 10px;
  }
  .dup-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 0;
    background: #00d26a; color: #06173a; font-size: 20px;
    font-weight: 700; cursor: pointer;
  }
  .dup-count { font-size: 22px; font-weight: 700; }

  .filter-bar {
    display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto;
    padding-bottom: 4px;
  }
  .chip {
    background: #142c5e; border: 0; color: #fff; padding: 6px 12px;
    border-radius: 16px; font-size: 12px; white-space: nowrap; cursor: pointer;
  }
  .chip.active { background: #00d26a; color: #06173a; }

  .trade-list { margin-top: 10px; }
  .trade-item {
    background: #142c5e; padding: 10px; border-radius: 8px;
    margin-bottom: 6px; display: flex; justify-content: space-between;
  }
  .empty { text-align: center; padding: 40px 20px; opacity: .6; }
  textarea {
    width: 100%; min-height: 120px; background: #06173a; color: #fff;
    border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 10px;
    font-family: inherit; font-size: 13px; resize: vertical;
  }
</style>
</head>
<body>

<header>
  <h1 id="page-title">Mi Álbum Panini 2026</h1>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="totalFill"></div></div>
    <div class="progress-text" id="totalText">0 / 0</div>
  </div>
</header>

<main id="app"></main>

<nav>
  <button data-view="sections" class="active"><span class="ico">📚</span>Álbum</button>

  <button data-view="trade"><span class="ico">🔄</span>Repetidas</button>
  <button data-view="share"><span class="ico">📤</span>Compartir</button>
</nav>

<div class="modal" id="modal">
  <div class="modal-content" id="modalContent"></div>
</div>

// --------- Estado ---------
const STORAGE_KEY = 'panini2026';
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let currentView = 'sections';
let currentSection = null;
let longPressTimer = null;
let longPressTriggered = false;

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function get(id) { return state[id] || { owned: false, dup: 0 }; }
function set(id, v) { state[id] = v; save(); render(); }

// --------- Cálculos ---------
function sectionsList() {
  const map = {};
  STICKERS.forEach(s => {
    if (!map[s.section]) map[s.section] = [];
    map[s.section].push(s);
  });
  return map;
}
function stats(items) {
  let owned = 0, dup = 0;
  items.forEach(s => { const g = get(s.id); if (g.owned) owned++; dup += g.dup||0; });
  return { owned, total: items.length, dup };
}

// --------- Render ---------
function render() {
  const total = stats(STICKERS);
  const pct = total.total ? (total.owned/total.total*100) : 0;
  document.getElementById('totalFill').style.width = pct+'%';
  document.getElementById('totalText').textContent =
    `${total.owned} / ${total.total} (${pct.toFixed(1)}%) · ${total.dup} repetidas`;

  const app = document.getElementById('app');
  const title = document.getElementById('page-title');

  if (currentView === 'sections' && !currentSection) {
    title.textContent = 'Mi Álbum Panini 2026';
    const groups = sectionsList();
    app.innerHTML = Object.keys(groups).map(name => {
      const st = stats(groups[name]);
      const p = st.total ? (st.owned/st.total*100) : 0;
      return `<div class="section-card" onclick="openSection('${name.replace(/'/g,"\\'")}')">
        <div>
          <div class="section-name">${name}</div>
          <div class="section-count">${st.owned} / ${st.total}</div>
          <div class="mini-bar"><div class="mini-fill" style="width:${p}%"></div></div>
        </div>
        <div style="font-size:20px;opacity:.5;">›</div>
      </div>`;
    }).join('');
  }

  else if (currentView === 'sections' && currentSection) {
    title.textContent = currentSection;
    const items = sectionsList()[currentSection] || [];
    app.innerHTML = `
      <button class="back-btn" onclick="currentSection=null;render()">‹ Volver</button>
      <div class="grid">
        ${items.map(s => stickerCard(s)).join('')}
      </div>`;
  }

  else if (currentView === 'missing') {
    title.textContent = 'Me Faltan';
    const missing = STICKERS.filter(s => !get(s.id).owned);
    app.innerHTML = missing.length
      ? `<div class="progress-text" style="margin-bottom:10px">${missing.length} estampas faltantes</div>
         <div class="grid">${missing.map(s => stickerCard(s)).join('')}</div>`
      : `<div class="empty">¡Completaste el álbum! 🎉</div>`;
  }

  else if (currentView === 'trade') {
    title.textContent = 'Mis Repetidas';
    const dups = STICKERS.filter(s => (get(s.id).dup||0) > 0);
    app.innerHTML = dups.length
      ? `<div class="progress-text" style="margin-bottom:10px">${dups.length} estampas para cambiar</div>
         <div class="trade-list">
           ${dups.map(s => {
             const g = get(s.id);
             return `<div class="trade-item" onclick="openModal('${s.id}')">
               <div><b>${s.number}</b> ${s.name}<br><small style="opacity:.6">${s.section}</small></div>
               <div style="color:#ff6b35;font-weight:700">×${g.dup}</div>
             </div>`;
           }).join('')}
         </div>`
      : `<div class="empty">No tienes repetidas registradas</div>`;
  }

  else if (currentView === 'share') {
    title.textContent = 'Compartir';
    const dups = STICKERS.filter(s => (get(s.id).dup||0) > 0);
    const missing = STICKERS.filter(s => !get(s.id).owned);
    let txt = `📕 Álbum Panini 2026 — ${total.owned}/${total.total}\n\n`;
    if (dups.length) {
      txt += `🔄 CAMBIO (${dups.length}):\n`;
      txt += dups.map(s => `${s.number}${(get(s.id).dup>1?` x${get(s.id).dup}`:'')}`).join(', ') + '\n\n';
    }
    if (missing.length) {
      txt += `🔍 BUSCO (${missing.length}):\n`;
      txt += missing.slice(0,80).map(s => s.number).join(', ');
      if (missing.length>80) txt += `... y ${missing.length-80} más`;
    }
    app.innerHTML = `
      <p style="font-size:13px;opacity:.8">Copia el texto y compártelo por WhatsApp, Telegram, etc.</p>
      <textarea id="shareTxt" readonly>${txt}</textarea>
      <button class="btn btn-primary" style="margin-top:10px" onclick="copyShare()">📋 Copiar al portapapeles</button>
      <button class="btn btn-secondary" style="margin-top:8px" onclick="shareNative()">📤 Compartir...</button>
      <hr style="margin:20px 0;border-color:rgba(255,255,255,.1)">
      <h3 style="font-size:14px">Respaldo de progreso</h3>
      <p style="font-size:12px;opacity:.7">Exporta para guardar o pasar a otro dispositivo</p>
      <button class="btn btn-secondary" onclick="exportData()">💾 Exportar datos</button>
      <button class="btn btn-secondary" style="margin-top:8px" onclick="importData()">📥 Importar datos</button>
      <button class="btn btn-secondary" style="margin-top:8px;background:rgba(255,80,80,.2)" onclick="resetAll()">🗑️ Borrar todo</button>
    `;
  }
}

function stickerCard(s) {
  const g = get(s.id);
  const cls = 'sticker' + (g.owned?' owned':'') + (s.foil?' foil':'');
  const dup = g.dup>0 ? `<span class="dup">×${g.dup}</span>` : '';
  return `<div class="${cls}"
    onpointerdown="startStickerPress(event, '${s.id}')"
    onpointerup="endStickerPress(event, '${s.id}')"
    onpointerleave="cancelStickerPress()"
    onpointercancel="cancelStickerPress()"
    oncontextmenu="return false">
    <div class="num">${s.number}</div>
    <div class="nm">${s.name}</div>
    ${dup}
  </div>`;
}

function openSection(name) { currentSection = name; render(); }

function startStickerPress(event, id) {
  event.preventDefault();
  longPressTriggered = false;
  clearTimeout(longPressTimer);

  longPressTimer = setTimeout(() => {
    longPressTriggered = true;
    openModal(id);
  }, 600);
}

function endStickerPress(event, id) {
  event.preventDefault();
  clearTimeout(longPressTimer);

  if (longPressTriggered) return;

  addSticker(id);
}

function cancelStickerPress() {
  clearTimeout(longPressTimer);
}

function addSticker(id) {
  const g = get(id);

  if (!g.owned) {
    set(id, { owned: true, dup: 0 });
    return;
  }

  set(id, { owned: true, dup: (g.dup || 0) + 1 });
}

function openModal(id) {
  const s = STICKERS.find(x => x.id === id);
  const g = get(id);
  document.getElementById('modalContent').innerHTML = `
    <h2>${s.number} — ${s.name}</h2>
    <div class="sub">${s.section}${s.foil?' · ⭐ Foil':''}</div>

    <div class="dup-row">
      <span>Repetidas</span>
      <div style="display:flex;align-items:center;gap:14px">
        <button class="dup-btn" onclick="changeDup('${id}',-1)">−</button>
        <span class="dup-count">${g.dup||0}</span>
        <button class="dup-btn" onclick="changeDup('${id}',1)">+</button>
      </div>
    </div>

    ${g.dup > 0 ? `
      <button class="btn btn-secondary" style="margin-top:14px;background:rgba(255,107,53,.25)" onclick="removeAllDup('${id}')">
        Quitar todas las repetidas
      </button>
    ` : ''}

    ${g.owned ? `
      <button class="btn btn-secondary" style="margin-top:8px;background:rgba(255,80,80,.2)" onclick="removeSticker('${id}')">
        Quitar del álbum
      </button>
    ` : ''}

    <button class="btn btn-secondary" style="margin-top:14px" onclick="closeModal()">Cerrar</button>
  `;
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

function toggleOwn(id) {
  const g = get(id);
  set(id, { owned: !g.owned, dup: 0 });
  openModal(id);
}

function changeDup(id, delta) {
  const g = get(id);
  const newDup = Math.max(0, (g.dup||0)+delta);
  set(id, { owned: true, dup: newDup });
  openModal(id);
}

function removeAllDup(id) {
  set(id, { owned: true, dup: 0 });
  openModal(id);
}

function removeSticker(id) {
  if (confirm('¿Quitar esta estampa del álbum y borrar sus repetidas?')) {
    set(id, { owned: false, dup: 0 });
    closeModal();
  }
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

// --------- Compartir ---------
function copyShare() {
  const t = document.getElementById('shareTxt');
  t.select(); document.execCommand('copy');
  alert('Copiado!');
}
function shareNative() {
  const text = document.getElementById('shareTxt').value;
  if (navigator.share) navigator.share({ text });
  else copyShare();
}
function exportData() {
  const blob = new Blob([JSON.stringify(state)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `panini-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const r = new FileReader();
    r.onload = () => {
      try { state = JSON.parse(r.result); save(); render(); alert('Datos importados'); }
      catch(err) { alert('Archivo inválido'); }
    };
    r.readAsText(file);
  };
  input.click();
}
function resetAll() {
  if (confirm('¿Borrar TODO el progreso? No se puede deshacer.')) {
    state = {}; save(); render();
  }
}

// --------- Nav ---------
document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentView = b.dataset.view;
    currentSection = null;
    render();
  };
});

render();
</script>
